<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 900" width="880" height="900" role="img">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17235B"/>
      <stop offset="1" stop-color="#0D1538"/>
    </linearGradient>
    <pattern id="hero-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
    </pattern>
    <linearGradient id="hero-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1538" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1538" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="880" height="900" fill="url(#hero-bg)"/>
  <rect width="880" height="900" fill="url(#hero-grid)"/>
  <circle cx="740" cy="150" r="230" fill="#83C341" opacity=".12"/>
  <circle cx="120" cy="800" r="200" fill="#83C341" opacity=".07"/>

  <!-- Masa yüzeyi -->
  <rect x="60" y="640" width="760" height="26" rx="13" fill="rgba(255,255,255,.10)"/>

  <!-- Açık defter -->
  <g transform="translate(150 330)">
    <path d="M0 40 C 90 6 200 6 290 40 L290 300 C 200 266 90 266 0 300 Z" fill="#FFFFFF" opacity=".95"/>
    <path d="M290 40 C 380 6 490 6 580 40 L580 300 C 490 266 380 266 290 300 Z" fill="#FFFFFF" opacity=".82"/>
    <path d="M290 40 L290 300" stroke="#17235B" stroke-opacity=".18" stroke-width="3"/>
    <rect x="42" y="86" width="200" height="10" rx="5" fill="#17235B" opacity=".16"/>
           <rect x="330" y="86" width="190" height="10" rx="5" fill="#17235B" opacity=".13"/><rect x="42" y="126" width="182" height="10" rx="5" fill="#17235B" opacity=".16"/>
           <rect x="330" y="126" width="176" height="10" rx="5" fill="#17235B" opacity=".13"/><rect x="42" y="166" width="164" height="10" rx="5" fill="#17235B" opacity=".16"/>
           <rect x="330" y="166" width="162" height="10" rx="5" fill="#17235B" opacity=".13"/><rect x="42" y="206" width="146" height="10" rx="5" fill="#17235B" opacity=".16"/>
           <rect x="330" y="206" width="148" height="10" rx="5" fill="#17235B" opacity=".13"/><rect x="42" y="246" width="128" height="10" rx="5" fill="#17235B" opacity=".16"/>
           <rect x="330" y="246" width="134" height="10" rx="5" fill="#17235B" opacity=".13"/>
  </g>

  <!-- Kalem -->
  <g transform="rotate(-24 660 560)">
    <rect x="600" y="540" width="230" height="26" rx="13" fill="#83C341"/>
    <rect x="600" y="540" width="60" height="26" rx="13" fill="#63A52A"/>
    <path d="M830 540 L878 553 L830 566 Z" fill="#E0AC69"/>
    <path d="M866 550 L878 553 L866 556 Z" fill="#2B2B2B"/>
  </g>

  <!-- Kitap yığını -->
  <g transform="translate(96 540)">
    <rect x="0" y="72" width="210" height="28" rx="10" fill="#83C341" opacity=".9"/>
    <rect x="14" y="40" width="182" height="28" rx="10" fill="#FFFFFF" opacity=".85"/>
    <rect x="6" y="8" width="196" height="28" rx="10" fill="#63A52A" opacity=".9"/>
  </g>

  <!-- Grafik kartı -->
  <g transform="translate(560 150)">
    <rect x="0" y="0" width="250" height="180" rx="22" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <rect x="28" y="116" width="24" height="30" rx="10" fill="#FFFFFF" opacity="0.35"/><rect x="70" y="92" width="24" height="54" rx="10" fill="#FFFFFF" opacity="0.35"/><rect x="112" y="68" width="24" height="78" rx="10" fill="#FFFFFF" opacity="0.35"/><rect x="154" y="44" width="24" height="102" rx="10" fill="#FFFFFF" opacity="0.35"/><rect x="196" y="20" width="24" height="126" rx="10" fill="#83C341" opacity="1"/>
  </g>

  <rect width="880" height="900" fill="url(#hero-fade)"/>
